# 强制 sway 只使用 Intel iGPU 的 DRM 设备，不去碰nvidia卡，避免wlr报错
WLR_DRM_DEVICES=/dev/dri/by-path/pci-0000:00:02.0-card
# nvidia 专有驱动在wlr需要这个标记
WLR_NO_HARDWARE_CURSORS=1
# 推荐，nvidia GBM
GBM_BACKEND=nvidia-drm
# Wayland 会话标识，截图、xdg-desktop-portal 正常工作
XDG_CURRENT_DESKTOP=sway
# 可选：QT、GTK优先wayland
QT_QPA_PLATFORM=wayland
GDK_BACKEND=wayland

